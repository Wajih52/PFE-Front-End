
<div class="modal-overlay" *ngIf="showModal" (click)="cancel()">
  <div class="modal" (click)="$event.stopPropagation()" [class]="config?.type || 'warning'">

    <div class="modal-icon">
      <span *ngIf="config?.type === 'danger'"><span class="material-symbols-outlined  cl-danger">dangerous</span></span>
      <span *ngIf="config?.type === 'warning'"><span class="material-symbols-outlined  cl-warning">warning</span></span>
      <span *ngIf="config?.type === 'info'"><span class="material-symbols-outlined  cl-info">info</span></span>
    </div>

    <h2>{{ config?.title }}</h2>
    <div class="message-text" [innerHTML]="config?.message"></div>
    <div class="prompt-input-wrapper" *ngIf="config?.isPrompt">
      <input
        [type]="currentInputType"
        [(ngModel)]="inputValue"
        [placeholder]="config?.placeholder || ''"
        (keyup.enter)="confirm()"
        autocomplete="current-password"
        autofocus
      />
      <button
        *ngIf="config?.inputType === 'password'"
        type="button"
        class="toggle-password"
        (click)="togglePasswordVisibility()"
        tabindex="-1"
      >
    <span class="material-symbols-outlined">
      {{ showPassword ? 'visibility_off' : 'visibility' }}
    </span>
      </button>
    </div>


    <div class="modal-actions">
      <button class="btn-cancel" (click)="cancel()">
        {{ config?.cancelText || 'Annuler' }}
      </button>
      <button class="btn-confirm"
              (click)="confirm()"
              [disabled]="config?.isPrompt && !inputValue.trim()">
        {{ config?.confirmText || 'Confirmer' }}
      </button>
    </div>
  </div>
</div>
